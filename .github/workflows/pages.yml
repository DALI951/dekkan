name: deploy pages

# Dekkan is a static app, so the whole thing can go live on GitHub Pages for
# free on every push. This is the public/free tier: no password, no server, the
# shop lives in the browser's own storage. (The modali host keeps the account
# + cloud-sync build.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Never cancel a deploy that is already live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: stage the static app
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js core icon _site/
          ls -R _site

      - name: every precached file must exist
        # The service worker precaches an explicit shell. If a file it names is
        # missing from _site, the app installs but opens broken/offline-broken.
        # Fail the deploy here instead of shipping that.
        run: |
          missing=0
          for f in $(grep -o "'\./[^']*'" sw.js | tr -d "'" | sed 's|^\./||'); do
            [ -z "$f" ] && continue
            if [ ! -e "_site/$f" ]; then
              echo "MISSING from _site: $f"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          echo "shell complete"

      - name: the php api must never be published
        run: |
          if [ -e _site/api ]; then
            echo "api/ got staged - refusing to publish server-side source"
            exit 1
          fi
          echo "no server source in the artifact"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
